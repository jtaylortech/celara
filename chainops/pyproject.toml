[project]
name = "chainops"
version = "0.1.0"
description = "Infrastructure-as-Code for blockchain validators"
authors = [
    {name = "Celara", email = "jarrede20@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "boto3>=1.28.0",
    "ansible>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]

[project.scripts]
chainops = "chainops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
