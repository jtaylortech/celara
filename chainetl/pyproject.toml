[project]
name = "chainetl"
version = "0.2.0"
description = "Production-grade blockchain data pipelines for EVM chains"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Celara Team", email = "jarrede20@gmail.com"}
]
maintainers = [
    {name = "Celara Team", email = "jarrede20@gmail.com"}
]
keywords = [
    "blockchain",
    "ethereum",
    "polygon",
    "arbitrum",
    "base",
    "etl",
    "data-pipeline",
    "web3",
    "evm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
]
requires-python = ">=3.11"

dependencies = [
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "structlog>=23.2.0",
    "psycopg2-binary>=2.9.9",
]

[project.urls]
Homepage = "https://github.com/jtaylortech/celara-homepage/tree/main/chainetl"
Repository = "https://github.com/jtaylortech/celara-homepage"
Issues = "https://github.com/jtaylortech/celara-homepage/issues"
Documentation = "https://github.com/jtaylortech/celara-homepage/blob/main/chainetl/README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]

[project.scripts]
chainetl = "chainetl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src/chainetl --cov-report=term-missing"
