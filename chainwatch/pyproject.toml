[project]
name = "chainwatch"
version = "0.1.0"
description = "Observability for decentralized systems"
authors = [
    {name = "Jarred Taylor", email = "jarrede20@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
chainwatch = "chainwatch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
